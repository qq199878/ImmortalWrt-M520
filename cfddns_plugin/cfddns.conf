# =====================================================================
# Cloudflare DDNS 配置（唯一凭据来源，权限必须 600）
# =====================================================================
# 说明：
#   - cfddns.uc / ddns-cf.sh / 页面全部从这个文件读，不要再硬编码到别处
#   - 改完不需要重启服务，下一次执行自动生效
# =====================================================================

# Cloudflare API Token（需要 Zone.DNS 编辑权限）
CF_TOKEN='YOUR_CF_TOKEN'

# Zone ID
ZONE_ID='YOUR_ZONE_ID'

# 要维护的完整域名
DOMAIN='home.example.com'

# 记录类型：A = IPv4（当前方案）
RECORD_TYPE='A'

# TTL（秒）。1 = 自动
TTL='120'

# 是否走 Cloudflare 代理（橙云）。false = 仅 DNS
PROXIED='false'

# 用于探测公网出口 IP 的接口。留空 = 走系统默认路由
# 本机实测：pppoe-wan 为运营商 NAT 内网地址，必须靠外部探测拿真实出口
WAN_IFACE='pppoe-wan'

# 公网 IP 探测源（逗号分隔，按顺序尝试，取第一个成功且格式合法的）
# 至少两个源结果一致才采用，防止单个源抽风写错
IP_SOURCES='https://ip.3322.net,https://ipv4.icanhazip.com,https://ipinfo.io/ip,https://ifconfig.me/ip'

# 探测超时（秒）
IP_TIMEOUT='6'

# 日志文件
LOG_FILE='/tmp/cfddns.log'

# 上次执行结果（页面读取）
LAST_FILE='/tmp/cfddns.last'
