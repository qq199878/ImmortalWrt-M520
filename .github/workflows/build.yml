name: Build ImmortalWrt for Ruijie M520

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'configs/ 下的配置文件'
        required: false
        default: 'm520.config'
  push:
    paths:
      - 'configs/**'
      - 'feeds.conf'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 确认 rust CI-LLVM 缓存就位
        run: |
          echo "== rust 缓存文件 =="
          ls -la dl/rustc/llvm-*/rust-dev-*.tar.xz || echo "WARNING: rust 缓存缺失"

      - name: 释放磁盘空间
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY}" || true
          sudo apt-get clean
          df -h

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 载入配置
        run: |
          cp configs/${{ github.event.inputs.config_file || 'm520.config' }} .config
          make defconfig

      - name: 下载源码包
        run: |
          make -j$(nproc) download || true

      - name: 编译固件
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-m520-firmware
          path: |
            bin/targets/ipq806x/generic/*.bin
            bin/targets/ipq806x/generic/*.itb
            bin/targets/ipq806x/generic/*uImage
            bin/targets/ipq806x/generic/sha256sums
            bin/targets/ipq806x/generic/*.manifest
          if-no-files-found: warn

      - name: 上传编译配置
        uses: actions/upload-artifact@v4
        with:
          name: build-config
          path: .config
