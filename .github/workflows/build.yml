name: Build ImmortalWrt for Ruijie M520

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'configs/ 下的配置文件'
        required: false
        default: 'm520-nss.config'
      target_pkg:
        description: '只编译指定包（留空=全量编译）'
        required: false
        default: ''
  push:
    paths:
      - 'configs/**'
      - 'feeds.conf'
      - '.github/workflows/**'
      - 'target/linux/**'
      - 'package/qca-nss/**'
      - 'package/kernel/qca-nss-dp/**'
      - 'nss-dl/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 确认 rust CI-LLVM 缓存就位
        run: |
          echo "== rust 缓存文件 =="
          ls -la dl/rustc/llvm-*/rust-dev-*.tar.xz || echo "WARNING: rust 缓存缺失"

      - name: 释放磁盘空间
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY}" || true
          sudo apt-get clean
          df -h
      - name: 配置大容量 Swap 虚拟内存（防止大型包 OOM）
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 修复 nginx-util CMake 版本
        run: |
          sed -i "s/VERSION 3.30/VERSION 3.28/" feeds/packages/net/nginx-util/src/CMakeLists.txt
          grep -n cmake_minimum_required feeds/packages/net/nginx-util/src/CMakeLists.txt

      - name: 载入配置
        run: |
          set -x
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.config_file }}"
            if [ -z "$RAW" ]; then
              RAW="m520-nss.config"
            fi
          else
            RAW="m520-nss.config"
          fi
          echo "事件类型: ${{ github.event_name }}"
          echo "最终原始配置输入 config_file = [$RAW]"
          echo "===== configs/ 目录内容 ====="
          ls -la configs/
          # 容错：允许用户填 m520-nss.config 或 configs/m520-nss.config
          NAME="$RAW"
          NAME="${NAME#configs/}"
          CFG="configs/$NAME"
          echo "最终使用配置: $CFG"
          if [ ! -f "$CFG" ]; then
            echo "!!! 错误：配置文件不存在: $CFG"
            echo "可用配置："
            ls -1 configs/*.config
            exit 1
          fi
          cp "$CFG" .config
          echo "===== 开始 make defconfig ====="
          make defconfig
          RC=$?
          echo "make defconfig 返回码: $RC"
          if [ $RC -ne 0 ]; then
            echo "!!! defconfig 失败"
            exit $RC
          fi
          echo "===== defconfig 后的 NSS 项 ====="
          grep -E 'qca-nss|iptables-mod-extra' .config || echo "(无 NSS 项)"
          echo "===== defconfig 后的 package/qca 项 ====="
          grep -E 'CONFIG_PACKAGE.*qca' .config || echo "(无 qca 项)"

      - name: 预置 NSS 源码包（避免重新 clone 导致 hash 不匹配）
        run: |
          mkdir -p dl
          if [ -d nss-dl ]; then
            cp -v nss-dl/*.tar.zst dl/ || true
          else
            echo "WARNING: nss-dl 目录缺失"
          fi
          echo "===== dl 中 NSS 包 ====="
          ls -lh dl/qca-nss-*.tar.zst 2>/dev/null || echo "(无)"
          echo "===== sha256 校验 ====="
          sha256sum dl/qca-nss-*.tar.zst 2>/dev/null || true
      - name: 下载源码包（含重试与坏包清理）
        run: |
          make -j$(nproc) download || true
          find dl -size -1024c -exec rm -f {} \; || true
          make -j2 download || true

      - name: 预检内核补丁
        run: |
          set -o pipefail
          echo "===== 预检 target/linux/prepare ====="
          make target/linux/prepare V=s -j1 2>&1 | tee prepare.log
          RC="${PIPESTATUS[0]}"
          echo "target/linux/prepare 返回码: $RC"
          exit "$RC"

      - name: 上传预检日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepare-log
          path: prepare.log
          if-no-files-found: warn

      - name: 编译固件
        run: |
          set -o pipefail
          TARGET="${{ github.event.inputs.target_pkg }}"
          if [ -n "$TARGET" ]; then
            echo "只编译: $TARGET"
            make -j$(nproc) "$TARGET" V=s 2>&1 | tee build.log
            RC="${PIPESTATUS[0]}"
            echo "目标编译返回码: $RC"
            exit "$RC"
          fi

          echo "全量编译"
          make -j$(nproc) IGNORE_ERRORS=m V=s 2>&1 | tee build.log
          RC="${PIPESTATUS[0]}"
          if [ "$RC" -ne 0 ]; then
            echo "并行编译失败，返回码: $RC；改用 -j1 V=s 重试"
            make -j1 IGNORE_ERRORS=m V=s 2>&1 | tee -a build.log
            RC="${PIPESTATUS[0]}"
          fi
          echo "最终编译返回码: $RC"
          exit "$RC"
      - name: 提取并展示编译错误摘要
        if: failure()
        run: |
          echo "## ❌ 编译构建失败排查报告" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            echo "### 🔍 关键错误匹配（最后 80 条）" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -i -E "(error:|failed to build|Stop\.|No such file or directory|fatal error:)" build.log | tail -n 80 >> "$GITHUB_STEP_SUMMARY" || echo "(未匹配到特定错误关键词)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "### 📄 build.log 尾部最后 150 行原始日志" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 150 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未找到 build.log 文件" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f prepare.log ]; then
            echo "### 📄 prepare.log 尾部 30 行" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 prepare.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
      - name: 上传 NSS 内核模块
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nss-kmods
          path: |
            bin/targets/ipq806x/generic/packages/kmod-qca-nss-*.apk
            bin/targets/ipq806x/generic/packages/*.ipk
            bin/targets/ipq806x/generic/kmods/**/*.ko
          if-no-files-found: warn
      - name: 上传固件产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-m520-firmware
          path: |
            bin/targets/ipq806x/generic/*.bin
            bin/targets/ipq806x/generic/*.itb
            bin/targets/ipq806x/generic/*uImage
            bin/targets/ipq806x/generic/sha256sums
            bin/targets/ipq806x/generic/*.manifest
          if-no-files-found: warn

      - name: 准备编译配置文件
        if: always()
        run: |
          cp -f .config build.config 2>/dev/null || true
      - name: 上传编译配置
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-config
          path: build.config